server.port=8080

# H2 Database Configuration (Development)
spring.datasource.url=jdbc:h2:mem:chatdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MySQL Configuration (Production - uncomment to use)
# spring.datasource.url=jdbc:mysql://localhost:3306/anonymous_chat?useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Application Name
spring.application.name=anonymous-chat

# Logging
logging.level.com.chat=DEBUG
logging.level.org.springframework.web=INFO
