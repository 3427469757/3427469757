server.port=8080

# SQLite Database Configuration (for DBeaver)
spring.datasource.url=jdbc:sqlite:E:/DBeaver/test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0

# MyBatis Plus Configuration (if needed later)
mybatis-plus.configuration.map-underscore-to-camel-case=true

# H2 Database Configuration (Development - commented out)
# spring.datasource.url=jdbc:h2:mem:chatdb
