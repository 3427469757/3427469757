server:
  port: 8080

spring:
  application:
    name: anonymous-chat-social
  
  # H2 Database Configuration (Development)
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:anonymous_chat;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # MyBatis Plus Configuration
  mybatis-plus:
    mapper-locations: classpath*:/mapper/**/*.xml
    type-aliases-package: com.anonymous.chat.entity
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  
  # WebSocket Configuration
  websocket:
    enabled: true

# Logging Configuration
logging:
  level:
    com.anonymous.chat: debug
    org.springframework.web: info

# File Upload Configuration
spring.servlet:
  multipart:
    max-file-size: 2MB
    max-request-size: 2MB
